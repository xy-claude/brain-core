name: release
run-name: Release ${{ github.ref_name }}

# Tag v* → build sdist+wheel → publish to PyPI (trusted publishing, no token) → GitHub Release.
# One-time setup on PyPI: add a "pending publisher" for xy-claude/brain-core, workflow
# release.yml, environment pypi. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub Release
  id-token: write     # OIDC for PyPI trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.12
      - run: uv sync --all-extras --all-groups
      - name: Tests must pass before anything ships
        run: uv run pytest -q
      - name: Tag must match pyproject version
        run: |
          v="$(uv run brain version)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject $v"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist/}
      - name: Release notes from CHANGELOG
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*

  # The MCP registry checks the PyPI README for `mcp-name: io.github.xy-claude/brain-core`,
  # so this runs after the PyPI publish. OIDC: a workflow in xy-claude/* owns io.github.xy-claude/*.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: server.json version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v | .packages[].version = $v' server.json > s.json && mv s.json server.json
      - run: ./mcp-publisher login github-oidc
      - name: Publish (PyPI metadata can lag the upload by a minute)
        run: |
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done; exit 1
