name: test
# the run is titled by the commit, even when GitHub cannot resolve head_commit
run-name: ${{ github.event.head_commit.message || github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: a release never changes OS without a deliberate bump
    steps:
      - uses: actions/checkout@v7

      - name: Nothing under local/ is tracked (it holds private eval data)
        run: test -z "$(git ls-files local)"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest --cov

      - name: Wheel installs clean and the stdio server lists five tools
        run: |
          uv build
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          python3 tests/smoke_stdio.py /tmp/clean/bin/brain

  windows:
    # the Windows path: Task Scheduler cron, msvcrt vault lock, uv-installed brain.exe; lint and
    # types are checked once above
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run pytest -q
        env:
          PYTHONUTF8: 1  # the fixtures write files with the default encoding; brain-core itself always names utf-8
      - name: brain.exe from uv tool installs, inits a lite agent, lists its tools
        shell: pwsh
        run: |
          uv tool install --from . brain-core-mcp
          $bin = uv tool dir --bin  # setup-uv moves the tool bin dir off %USERPROFILE%
          uv run python tests/smoke_stdio.py "$bin\brain.exe"
