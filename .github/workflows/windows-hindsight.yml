name: windows-hindsight
# The real thing on Windows, end to end: install Hindsight as the logon service, wait for /health,
# run the install again (the restart path). Slow: it downloads Postgres and an embedding model, so
# it runs only when the installer changes, or by hand.
run-name: ${{ github.event.head_commit.message || github.ref_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - src/brain_core/installer.py
      - install.ps1
      - .github/workflows/windows-hindsight.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hindsight:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: brain from this checkout, on PATH
        shell: pwsh
        run: |
          uv tool install --from . brain-core-mcp
          "$(uv tool dir --bin)" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: brain hindsight install, wait for /health
        shell: pwsh
        run: brain hindsight install --provider claude-code --wait 900

      - name: logon entry is registered and the service answers
        shell: pwsh
        run: |
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v brain-core-hindsight
          brain hindsight status
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8888/health).Content

      - name: a second install restarts it and it is healthy again
        shell: pwsh
        run: brain hindsight install --provider claude-code --wait 300

      - name: a full agent sees the store
        shell: pwsh
        continue-on-error: true  # doctor also reports cron and Claude Code, which this job does not set up
        run: |
          brain init CI --path "$env:RUNNER_TEMP\agent" --user ci
          brain doctor "$env:RUNNER_TEMP\agent"

      - name: service log
        if: always()
        shell: pwsh
        run: Get-Content "$HOME\.config\hindsight\api.log" -Tail 80 -ErrorAction SilentlyContinue

  installer:
    # install.ps1 exactly as the README runs it, in Windows PowerShell 5.1 (not pwsh), with no uv
    # preinstalled: the path a real user takes. brain comes from this commit through -Ref.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: the one-liner, lite, with -Desktop, under the Restricted policy a new PC ships with
        shell: powershell
        run: |
          # the runner's own policy is permissive, which hid a uv installer that exits under
          # Restricted and took the user's window with it (2026-11-09)
          $ref = "${{ github.event.pull_request.head.sha || github.sha }}"
          $cmd = "'policy: ' + (Get-ExecutionPolicy); & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Agent Atlas -User Alex -Desktop -Ref $ref; 'reached the end of the installer'"
          $out = powershell -NoProfile -ExecutionPolicy Restricted -Command $cmd
          $out
          if (-not ($out -match "policy: Restricted")) { throw "the child did not run under Restricted" }
          if (-not ($out -match "reached the end of the installer")) { throw "the installer ended the PowerShell session" }
          if (-not ($out -match "installed uv ")) { throw "uv was not installed by our own download" }

      - name: agent, scheduled tasks and desktop entry exist
        shell: powershell
        run: |
          $env:Path = "$HOME\.local\bin;$env:Path"
          brain version
          if (-not (Test-Path "$HOME\Agents\Atlas\brain.yaml")) { throw "no agent folder" }
          schtasks /Query /TN brain-core.atlas.daily
          if ($LASTEXITCODE) { throw "daily task missing" }
          schtasks /Query /TN brain-core.atlas.weekly
          if ($LASTEXITCODE) { throw "weekly task missing" }
          $cfg = Get-Content -Raw "$env:APPDATA\Claude\claude_desktop_config.json" | ConvertFrom-Json
          $cfg.mcpServers.brain | ConvertTo-Json
          if ($cfg.mcpServers.brain.args[0] -ne "serve") { throw "desktop entry missing" }

      - name: the daily task really runs and writes its log
        shell: powershell
        run: |
          schtasks /Run /TN brain-core.atlas.daily
          $log = "$HOME\Agents\Atlas\data\logs\daily.log"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 5
          schtasks /Query /TN brain-core.atlas.daily /V /FO LIST | Select-String "Last Result|Task To Run"
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "brief" -Quiet)) { throw "daily did not report a brief" }
