# $name — generated by `brain init` on $today. Edit freely; `brain doctor` validates it.
name: $name

stores:
  vault: ./vault                      # markdown memory, by kind (facts, patterns, decisions, …)
  hindsight:                          # self-hosted Hindsight (episodic memory, vector recall)
    url: http://127.0.0.1:8888
    bank: $bank
  transcripts: ~/.claude/projects       # Claude Code session files of this folder, indexed read-only
  # transcripts_cwd: /path/claude/runs/in # only when brain.yaml is not in that folder
  # the entity graph is a table in data/brain.db; `graph:` only names a legacy Kuzu
  # graph for a one-time `brain graph import`
  # graph: {script: /path/to/entity_graph.py, python: python3}
  # notes: [~/.claude/projects/<slug>/memory, ../shared]  # read-only markdown folders recall also searches

session:
  mental_models: [active-priorities]  # Hindsight mental models read at session start
  marker: ./data/last_close.txt       # clean-close marker; missing after a start = recovery

status:
  context_files: [CLAUDE.md, .claude/rules/*.md]   # what counts as always-loaded context

cron:                                 # `brain cron install`: launchd on macOS, user crontab on Linux
  daily: "06:07"                      # brain daily: daily brief, health line, Hindsight backup
  weekly: "Sun 07:13"                 # brain weekly: archive old sessions, refresh mental models
  backup: {dir: ~/Backups/hindsight, keep: 14}
