# brain_recall eval (M10). Each task: a query an agent would ask, and substrings any one of
# which must appear in the top-`limit` results. Pulled from XYCLAUDE's real vault on 2026-11-02.
# Run: brain-core/.venv/bin/python tests/eval/run_recall.py --config local/xyclaude.brain.yaml
limit: 10
tasks:
