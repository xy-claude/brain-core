[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-core-mcp"  # PyPI: "brain-core" collides with an existing "braincore"
version = "0.4.16"
description = "A memory for your Claude Code agent that survives the session: one local MCP server, five tools, a markdown vault, an eval."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "xy-claude" }]
keywords = ["ai", "agents", "memory", "llm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0,<2",  # the server is written against the 1.x FastMCP API
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
brain = "brain_core.cli.main:app"
brain-core-mcp = "brain_core.cli.main:app"  # `uvx brain-core-mcp serve DIR` runs with nothing installed

[project.urls]
Repository = "https://github.com/xy-claude/brain-core"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brain_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
allowed-confusables = ["×", "›", "—", "→"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert False in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["brain_core", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/brain_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
